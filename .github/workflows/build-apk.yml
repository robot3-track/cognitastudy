name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      # Step 1: Force create configuration files BEFORE doing any npm tasks
      - name: Pre-initialize Project Configurations
        run: |
          if [ ! -f package.json ]; then
            echo "package.json not found! Creating fallback..."
            echo '{"name": "cognitastudy", "version": "1.0.0", "private": true, "scripts": { "build": "mkdir -p www && echo '\''<h1>Hello</h1>'\'' > www/index.html" }}' > package.json
          fi
          
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.js ]; then
            echo "Capacitor config not found! Creating fallback..."
            echo '{"appId": "com.cognitastudy.app", "appName": "cognitastudy", "webDir": "www"}' > capacitor.config.json
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Build Web Project
        run: |
          npm install
          npm run build

      - name: Install Capacitor & Create Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          # Now it has the appId initialized from step 1
          npx cap add android || echo "Android platform folder already exists."
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Fix Kotlin Duplicate Class Error
        run: |
          cat <<EOT >> android/app/build.gradle
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.10'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.10'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.10'
              }
          }
          EOT

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
